<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlotHour · Email designs</title><style>*{box-sizing:border-box}body{margin:0;background:#eeedf5;color:#34314f;font:14px Arial,sans-serif}header{max-width:1000px;padding:28px 24px 16px;margin:auto}h1{font-size:24px;font-weight:500;letter-spacing:-.6px}p{color:#777489;font-size:12px;line-height:1.8}nav{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0}button{padding:10px 14px;border:1px solid #d7d6e4;background:transparent;border-radius:6px;color:#66667e;cursor:pointer;font:12px Arial}button[aria-pressed=true]{background:#35344f;color:white;border-color:#35344f}iframe{display:block;width:100%;height:1450px;border:0}button:focus-visible{outline:2px solid #746eac;outline-offset:3px}</style></head><body><header><p>PLOTHOUR / EMAIL DESIGN LIBRARY</p><h1>Your reports, thoughtfully delivered.</h1><p>All seven versions use the production email renderer. Illustrative data; preview links lead to your local workspace.</p><nav aria-label="Email designs"><button type="button" data-type="agenda" aria-pressed="false">Daily agenda</button><button type="button" data-type="weekly-plan" aria-pressed="false">Weekly plan</button><button type="button" data-type="weekly-recap" aria-pressed="true">Weekly recap</button><button type="button" data-type="monthly-recap" aria-pressed="false">Monthly report</button><button type="button" data-type="comparison" aria-pressed="false">Progress comparison</button><button type="button" data-type="task-reminder" aria-pressed="false">Task reminder</button><button type="button" data-type="task-update" aria-pressed="false">Task update</button></nav></header><iframe id="preview" title="Weekly recap email preview" src="/previews/email-letters/weekly-recap.html"></iframe><script>document.querySelectorAll('[data-type]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',b===button));const frame=document.getElementById('preview');frame.src='/previews/email-letters/'+button.dataset.type+'.html';frame.title=button.textContent+' email preview';});</script></body></html>
